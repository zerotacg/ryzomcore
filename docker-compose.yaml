services:
  devcontainer:
    image: "ryzomcore/devcontainer"
    build: ./.devcontainer
    volumes:
      - ./:/tmp/ryzomcore

  tools:
    image: "ryzomcore/tools"
    build:
      context: .
      dockerfile: docker/Dockerfile
    volumes:
      - ".:/home/ryzom/ryzomcore"

  ubuntu20:
    image: "ryzomcore/devcontainer-ubuntu20"
    build:
      context: .devcontainer
      dockerfile: ubuntu20.Dockerfile
    volumes_from:
      - devcontainer

  ubuntu20_client:
    image: "ryzomcore/devcontainer-ubuntu20_client"
    build:
      context: .devcontainer
      dockerfile: ubuntu20_client.Dockerfile
    volumes_from:
      - devcontainer

  web:
    image: bitnami/nginx:1.25
    #    image: nginx:1.25
    volumes:
      - ./dev/nginx/conf.d:/opt/bitnami/nginx/conf/server_blocks
      - ./web:/app:ro
    ports:
      - 8080:80
    depends_on:
      - php

  php:
    image: bitnami/php-fpm:8.2
    volumes:
      - ./web:/app
    depends_on:
      - db

  db:
    image: mariadb:11
    environment:
      MARIADB_ROOT_PASSWORD: password
    ports:
      - 3306:3306

  nelns:
    image: "ryzomcore/nelns"
    build:
      context: .
      dockerfile: nelns/docker/Dockerfile

  snowballs:
    image: "ryzomcore/snowballs"
    build:
      context: .
      dockerfile: snowballs2/docker/Dockerfile

  web:
    image: "ryzomcore/web"
    build: "./web"
    ports:
      - "8080:8080"
    volumes:
      - ./web/docs:/var/www/html/docs
      - ./web/private_php:/var/www/html/private_php
      - ./web/public_php:/var/www/html/public # needs to be writable by the web server
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mariadb:latest
    ports:
      - "3306:3306"
    environment:
      MARIADB_ROOT_PASSWORD: ryzom
      MARIADB_USER: ryzom
      MARIADB_PASSWORD: ryzom
      MARIADB_DATABASE: ryzom
    healthcheck:
      test: [ "CMD", "healthcheck.sh", "--connect", "--innodb_initialized" ]
      start_period: 10s
      interval: 10s
      timeout: 5s
      retries: 3

