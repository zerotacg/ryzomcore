name: "Ryzom Client: cross compile 32-Bit windows client (vcpkg)"

on:
  push:
    branches: [ "core4", "feature/*" ]
    paths:
      - .github/workflows/cross-compile-client-vcpkg.yml
      # TODO use nel package instead
      - nel/**
      - ryzom/**
      - cmake/**
      - CMakeModules/**
      - CMakeLists.txt
      - CMakePresets.json
      - vcpkg.json
      - vcpkg-configuration.json
  pull_request:
    branches: [ "core4" ]
    paths:
      - .github/workflows/cross-compile-client-vcpkg.yml
      # TODO use nel package instead
      - nel/**
      - ryzom/**
      - cmake/**
      - CMakeModules/**
      - CMakeLists.txt
      - CMakePresets.json
      - vcpkg.json
      - vcpkg-configuration.json
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - uses: actions/checkout@v4
    - name: Set reusable strings
      # Turn repeated input strings (such as the build output directory) into step outputs. These step outputs can be used throughout the workflow file.
      id: strings
      shell: bash
      run: |
        echo "build-output-dir=${{ github.workspace }}/build" >> "$GITHUB_OUTPUT"
        echo "vcpkg-dir=${{ github.workspace }}/.vcpkg" >> "$GITHUB_OUTPUT"
        COMMIT_HASH=${{ github.sha }}
        echo "version=sha.${COMMIT_HASH:0:8}" >> "$GITHUB_OUTPUT"

    - uses: lukka/get-cmake@latest
      with:
        cmakeVersion: 3.31.6

    - uses: lukka/run-vcpkg@v11

    - name: Dependencies
      run: |
        sudo apt update
        sudo apt install --yes \
        mingw-w64 \
        mingw-w64-tools

    - name: Configure CMake
      continue-on-error: true
      run: >
        cmake --preset ryzom-client-x86-mingw-vcpkg
        -B ${{ steps.strings.outputs.build-output-dir }}
        -DCMAKE_CONFIGURATION_TYPES=Release
        -DVCPKG_INSTALLED_DIR=${{ steps.strings.outputs.vcpkg-dir }}

    - name: debug
      continue-on-error: true
      run: >
        cat vcpkg/buildtrees/openal-soft/install-x86-mingw-static-dbg-out.log

    - name: Build
      run: cmake --build ${{ steps.strings.outputs.build-output-dir }} --config Release
